name: Bot IMAX

on:
  schedule:
    # Cada 30 minutos todo el día
    - cron: "0,30 * * * *"
    # Cada 5 min de 22:30 a 01:30 (hora Argentina)
    - cron: "30-55/5 1 * * *"
    - cron: "*/5 2-3 * * *"
    - cron: "0-30/5 4 * * *"
    # Cada 5 min de 07:30 a 10:30 (hora Argentina)
    - cron: "30-55/5 10 * * *"
    - cron: "*/5 11-12 * * *"
    - cron: "0-30/5 13 * * *"  # Permite ejecutarlo a mano con el botón "Run workflow"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba (manda un mensaje de confirmación a Telegram)"
        type: boolean
        default: true

# Evita que dos ejecuciones corran al mismo tiempo
concurrency:
  group: bot-imax
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  chequear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '1' || '0' }}
        run: python bot_imax.py

      - name: Guardar el registro de películas avisadas
        run: |
          git config user.name "bot-imax"
          git config user.email "bot-imax@users.noreply.github.com"
          git add estado.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado de avisos"
            git pull --rebase
            git push
          fi
